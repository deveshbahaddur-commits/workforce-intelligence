services:
  - type: web
    name: workforce-intelligence
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run build && cd ../frontend && npm ci && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SESSION_JWT_SECRET
        sync: false
      - key: HRIS_SHEET_ID
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: HRIS_SHEET_GID
        value: "0"
      - key: HRIS_SHEET_CACHE_TTL_MS
        value: "300000"
      - key: FRONTEND_URL
        value: https://workforce-intelligence.onrender.com
